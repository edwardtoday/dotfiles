model_provider = "codex"
model = "gpt-5.4"
notify = [ "python3", "/Users/qingpei/.codex/notify.py" ]
disable_response_storage = true
model_reasoning_effort = "xhigh"
model_reasoning_summary = "detailed"
show_raw_agent_reasoning = true
web_search = "live"
personality = "pragmatic"
sandbox_mode = "danger-full-access"
approval_policy = "on-request"
service_tier = "fast"
model_context_window = 800000
model_auto_compact_token_limit = 700000

[model_providers.lab]
name = "lab"
base_url = "https://lab.sansi.io/v1"
wire_api = "responses"
requires_openai_auth = true

[model_providers.codex]
name = "codex"
base_url = "https://code.ppchat.vip/v1"
wire_api = "responses"
requires_openai_auth = true

[mcp_servers.chrome-devtools]
command = "/Users/qingpei/.npm-global/bin/chrome-devtools-mcp"
args = []

[mcp_servers.gitlab]
command = "/Users/qingpei/.npm-global/bin/gitlab-mcp"
args = []
startup_timeout_sec = 30

[mcp_servers.playwright]
args = [ "@playwright/mcp@latest" ]
command = "npx"

[mcp_servers.pencil]
command = "/Applications/Pencil.app/Contents/Resources/app.asar.unpacked/out/mcp-server-darwin-arm64"
args = [ "--app", "desktop" ]

[features]
shell_snapshot = true
unified_exec = true
skills = true
js_repl = true
multi_agent = true
prevent_idle_sleep = true

[agents]
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 1200

[notice]
hide_gpt5_1_migration_prompt = true
hide_full_access_warning = true

[profiles.skill-install]
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
network_access = true

[tui]
status_line = [ "model-with-reasoning", "context-remaining", "current-dir", "git-branch", "context-window-size" ]
