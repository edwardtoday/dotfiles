version: 1

# `~/.agents/skills` is a link farm. Personal skills live in the private Git
# repository; third-party skills remain sourced from their upstream projects.
runtime_root: ~/.agents/skills
state_root: ~/.local/share/agent-skills
personal:
  repository: https://github.com/edwardtoday/agent-skills-private.git
  ref: main
  source_subdir: skills
  skills:
    - advance-my-gitlab-mrs
    - generate-images-via-providers
    - gitlab-ci-pipeline-optimization
    - gitlab-pipeline-failure-triage
    - gitlab-wiki-export
    - markdown-report-pdf
    - obsidian-meeting-filename-normalizer
    - strategy-research-report
    - web-to-obsidian-note
    - youtube-to-obsidian-note

